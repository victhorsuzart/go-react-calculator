# Serves the built SPA and proxies /api/ to the backend (SPEC §10.2).
# add_header in a location drops the server-level ones, so each location
# lists its own headers.
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite's content-hashed build output.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # No trailing slash: the request path reaches the API unchanged.
    # The API sets X-Content-Type-Options itself.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
